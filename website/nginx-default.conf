# Static server for the built docs site.
#
# This is the stock nginx:alpine default.conf plus these changes: absolute_redirect off, the
# site's own 404 page, a permanent redirect for the retired locale prefixes, security headers and
# /.well-known/security.txt (both explained in the server block).
#
# nginx defaults to absolute_redirect on, so when it issues the trailing-slash redirect for a
# directory it rebuilds a full URL from the Host header and its own listen port. It has no idea TLS
# was terminated upstream, so it answers with http://. Measured on docs.gauzy.co on 2026-09-27:
#
#     https://docs.gauzy.co/api/overview  ->  301  http://docs.gauzy.co/api/overview/
#
# With absolute_redirect off nginx emits a relative `Location: /api/overview/`, and the client
# keeps whatever scheme it arrived on -- one hop, no downgrade, no dependence on knowing the
# public scheme.
# (prettyUrls: "slash" in sourcey.config.ts means the site itself never links to the slash-less
# form; this only matters for old or external links.)
#
# error_page 404 serves the site's own 404.html (site chrome, navigation, search) with a 404 status
# instead of nginx's bare built-in page.
#
# Retired locale prefixes. Until 2026-07 the site was built in 13 locales, so search engines know
# about 5,000 URLs of the form /<locale>/<route> (/de/api/overview, /fr/, ...). The image now builds
# English only, so every one of them was a 404 that Google kept re-fetching. Each now answers one
# 301 to the English page:
#
#     /de  /de/               ->  /
#     /de/api/overview        ->  /api/overview/     (a page directory: straight to its final form)
#     /de/sitemap.xml         ->  /sitemap.xml       (anything else keeps its path as-is)
#
# Only the 12 retired codes, and only as the whole first path segment: /de and /de/... match,
# /deployment/ and /frontend/ never do. The redirect only fires for a request that would otherwise
# 404, so a build that emits a locale again is served as usual instead of being redirected away.
# The Location is relative (absolute_redirect off), so the client stays on https, and the query
# string is kept.
#
# The rest of the path must start with a character other than / or \ (\x5c). nginx decodes %5C
# before the rewrite, so /de/%5Cevil.com would otherwise answer `Location: /\evil.com`, which
# browsers read as //evil.com -- an open redirect to any host. Such a path stays a plain 404.
# cspell:ignore Cevil
map $uri $retired_locale_rest {
    "~^/(?:ar|bg|de|es|fr|he|it|nl|pl|pt|ru|zh)(/.*)?$"  $1;
}

server {
    listen       80;
    server_name  localhost;

    absolute_redirect off;

    # Security headers, the baseline of every Ever website (ever.co). `always` sends them with every
    # status, the 301s and 404s included. nginx drops ALL server-level add_header lines in a location
    # that sets an add_header of its own, so a location below that adds a header must repeat this set.
    # No HSTS here: the Cloudflare zone sends it. server_tokens off keeps the nginx version out of the
    # Server header and the error pages.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # RFC 9116 security.txt, answered by nginx itself so it does not depend on the Docusaurus build
    # copying a dot-directory out of static/. An exact-match location wins over every other one, so
    # no built file can shadow it. It sets no add_header, so it inherits the set above.
    # Renew Expires before 2027-11-19.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        return 200 "Contact: mailto:security@ever.co\nExpires: 2027-11-19T00:00:00.000Z\nPreferred-Languages: en\nCanonical: https://docs.gauzy.co/.well-known/security.txt\nPolicy: https://github.com/ever-co/ever-gauzy/security/policy\n";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location ~ ^/(?:ar|bg|de|es|fr|he|it|nl|pl|pt|ru|zh)(?:/|$) {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # A location-level error_page replaces every inherited one, so the 5xx page is repeated.
        error_page   404  =  @retired_locale;
        error_page   500 502 503 504  /50x.html;
    }

    location @retired_locale {
        root   /usr/share/nginx/html;
        if (-d $document_root$retired_locale_rest) {
            rewrite  ^/[^/]+(/[^/\x5c].*?)?/?$  $1/  permanent;
        }
        rewrite  ^/[^/]+(/[^/\x5c].*)$  $1  permanent;
    }

    error_page   404              /404.html;
    location = /404.html {
        root   /usr/share/nginx/html;
        internal;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
